name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pester:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser
          $r = Invoke-Pester ./Tests -Output Detailed -PassThru
          if ($r.FailedCount) { exit 1 }
      - name: Manifest
        shell: pwsh
        run: Test-ModuleManifest ./PowerBGP.psd1
      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $e = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $e | Format-Table
          if ($e) { exit 1 }
